# Service d'analyse MASO sur Render (offre gratuite). Render → New → Blueprint → choisir ce dépôt.
# Les clés sont saisies dans le tableau de bord Render (jamais dans ce fichier).
services:
  - type: web
    name: maso-analyse
    runtime: docker
    rootDir: services/analyse
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # adresse de l'application, ex. https://maso.vercel.app
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
